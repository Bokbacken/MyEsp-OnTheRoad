name: Build firmware

on:
  pull_request:
  workflow_dispatch:
    inputs:
      build_c6:
        description: Build C6 radio firmware too
        type: boolean
        default: false
      build_waveshare_factory:
        description: Build Waveshare's ESP-IDF factory touch test
        type: boolean
        default: false
      waveshare_ref:
        description: Waveshare repository ref for the factory test
        type: string
        default: main
      waveshare_touch_trace:
        description: Buffer raw factory touch reads; Refresh dumps them to serial
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: firmware-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-waveshare-factory:
    name: Build Waveshare factory test
    if: github.event_name == 'workflow_dispatch' && inputs.build_waveshare_factory
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trace tooling
        if: inputs.waveshare_touch_trace
        uses: actions/checkout@v4
        with:
          path: trace-tools
          persist-credentials: false

      - name: Checkout Waveshare example
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.5B
          ref: ${{ inputs.waveshare_ref }}
          path: waveshare
          persist-credentials: false

      - name: Record source revision
        id: source
        run: echo "sha=$(git -C waveshare rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Instrument factory touch reads
        if: inputs.waveshare_touch_trace
        run: |
          python3 -m unittest discover -s trace-tools/tests -p test_instrument_waveshare_touch.py
          python3 trace-tools/tools/instrument_waveshare_touch.py waveshare/examples/esp-idf/01_factory/components/esp_bsp/bsp_touch.c waveshare/examples/esp-idf/01_factory/main/drawing_screen.c

      - name: Build ESP-IDF factory example
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          command: |
            set -eu
            cd waveshare/examples/esp-idf/01_factory
            idf.py --version
            idf.py set-target esp32s3
            idf.py build
            mkdir -p webflash
            idf.py merge-bin -o merged.bin
            cp build/flasher_args.json webflash/flash_args.json
            cp build/*.bin webflash/
            test -s webflash/merged.bin
            cat > webflash/README.txt <<'EOF'
            Waveshare ESP32-S3-Touch-LCD-3.5B factory example

            merged.bin is the complete ESP-IDF image merged for flashing at offset 0x0.
            In a browser flasher that accepts a local binary, select merged.bin and use
            flash address 0x0. Do not select merged.bin as an application-only image.

            The build was made from the Waveshare ESP-IDF factory example, not from
            MyEsp-OnTheRoad. After testing, restore the normal application by flashing
            its firmware image.
            EOF
            echo "Waveshare source commit: ${{ steps.source.outputs.sha }}" >> webflash/README.txt
            echo "Buffered touch trace enabled: ${{ inputs.waveshare_touch_trace }}" >> webflash/README.txt
            cp components/esp_bsp/bsp_touch.c webflash/bsp_touch.c
            cp main/drawing_screen.c webflash/drawing_screen.c
            python3 - <<'PY'
            import json
            with open("webflash/manifest.json", "w", encoding="utf-8") as f:
                json.dump({
                    "name": "Waveshare ESP32-S3 Touch LCD 3.5B factory test",
                    "version": "0.1",
                    "builds": [{
                        "chipFamily": "ESP32-S3",
                        "parts": [{"path": "merged.bin", "offset": 0}]
                    }]
                }, f, indent=2)
                f.write("\n")
            PY

      - name: Upload web flasher package
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-3.5b-factory${{ inputs.waveshare_touch_trace && '-touch-trace' || '' }}-webflash-${{ steps.source.outputs.sha }}
          path: waveshare/examples/esp-idf/01_factory/webflash/
          if-no-files-found: error
          retention-days: 30

  changes:
    name: Select required builds
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.plan.outputs.firmware }}
      c6: ${{ steps.plan.outputs.c6 }}
      c6_ref: ${{ steps.plan.outputs.c6_ref }}
      c6_idf: ${{ steps.plan.outputs.c6_idf }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test build selection
        run: python3 -m unittest discover -s tests -p test_ci_build_plan.py
      - name: Select builds
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_build_plan.py

  build-host-fw:
    name: build-host-fw-esp32c6
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.c6 == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require successful build selection
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
        run: test "$PLAN_RESULT" = success

      - name: Checkout ESP-Hosted MCU
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-hosted-mcu
          ref: ${{ needs.changes.outputs.c6_ref }}
          path: esp_hosted
          submodules: recursive
          persist-credentials: false

      - name: Record upstream revision
        id: upstream
        run: echo "ref=$(git -C esp_hosted rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build C6 Host firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ needs.changes.outputs.c6_idf }}
          target: esp32c6
          command: |
            set -eu
            cd esp_hosted/examples/ota/coprocessor_ota/cp
            idf.py --version
            idf.py set-target esp32c6
            idf.py build
            grep -qx 'CONFIG_ESP_HOSTED_CP=y' sdkconfig
            grep -qx 'CONFIG_ESP_HOSTED_CP_FEAT_WIFI=y' sdkconfig
            test "$(stat -c %s build/eh_cp_ota_coprocessor_ota.bin)" -le $((0x1C0000))
            cp build/eh_cp_ota_coprocessor_ota.bin build/host_fw.bin

      - name: Upload C6 Host firmware
        uses: actions/upload-artifact@v4
        with:
          name: host-fw-esp32c6-${{ steps.upstream.outputs.ref }}
          path: |
            esp_hosted/examples/ota/coprocessor_ota/cp/build/host_fw.bin
            esp_hosted/examples/ota/coprocessor_ota/cp/build/eh_cp_ota_coprocessor_ota.elf
            esp_hosted/examples/ota/coprocessor_ota/cp/build/partition_table/partition-table.bin
            esp_hosted/examples/ota/coprocessor_ota/cp/sdkconfig
          if-no-files-found: error

  build:
    name: build-${{ matrix.board }}
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.firmware == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: es3c35p
            identity: ES3C35P
            target: esp32s3
            label: ""
            defaults: "sdkconfig.defaults;sdkconfig.defaults.esp32s3"
          - board: p4-43
            identity: P4_43
            target: esp32p4
            label: "-unverified"
            defaults: "sdkconfig.defaults;sdkconfig.defaults.esp32p4"
          - board: s3-35b
            identity: S3_35B
            target: esp32s3
            label: "-unverified"
            defaults: "sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.s3-35b"

    steps:
      - name: Require successful build selection
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
        run: test "$PLAN_RESULT" = success

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test release tooling (no publication)
        if: matrix.board == 'es3c35p'
        run: python3 -m unittest discover -s tests -p test_firmware_release.py

      - name: Test board peripherals (host)
        if: matrix.board == 'es3c35p'
        run: |
          python3 tests/test_board_peripherals.py
          python3 tests/test_board_power_math.py
          python3 tests/test_s3_35b_board_power.py
          python3 tests/test_i2c_pacing.py
          python3 tests/test_rtc_pcf85063.py
          python3 tests/test_rtc_sync.py
          python3 -m unittest discover -s tests -p test_idf_spi_fix.py
          python3 tests/test_sd_log_diagnostics.py
          python3 tests/test_sd_clock.py
          python3 tests/test_upload_pipeline.py
          python3 tests/test_file_delete.py
          python3 tests/test_upload_body.py
          python3 tests/test_kara_overload.py
          python3 tests/test_upload_memory_audio.py
          python3 tests/test_flash_repair.py
          python3 tests/test_nvs_backup.py
          node tests/test_nvs_web.js
          node tests/test_karaoke_web.js
          node tests/test_karaoke_picker.js
          node tests/test_karaoke_playlists_page.js
          python3 tests/test_karaoke_settings.py
          python3 tests/test_karaoke_book.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Imain tests/test_karaindex.cpp main/kara_index.cpp -o /tmp/test_karaindex
          /tmp/test_karaindex
          python3 tests/test_diag_mac.py
          python3 tests/test_ota_stream.py
          python3 tests/test_screen_power.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Imain tests/test_sudoku.cpp main/sudoku_game.cpp -o /tmp/test_sudoku
          /tmp/test_sudoku
          python3 tests/test_panel_sleep.py
          python3 tests/test_reboot.py
          g++ -std=c++17 -Wall -Wextra -Werror -Imain tests/test_power_interval.cpp -o /tmp/test_power_interval
          /tmp/test_power_interval
          python3 tests/test_power_history.py
          g++ -std=c++17 -Wall -Wextra -Werror -Imain tests/test_yatzy.cpp main/game_yatzy.cpp -o /tmp/test_yatzy
          /tmp/test_yatzy
          g++ -std=c++17 -Wall -Wextra -Werror -Imain tests/test_multiplayer_protocol.cpp -o /tmp/test_multiplayer_protocol
          /tmp/test_multiplayer_protocol
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/stub -Imain tests/test_game_live.cpp main/game_live.cpp main/game_yatzy.cpp -o /tmp/test_game_live
          /tmp/test_game_live
          python3 tests/test_power_io.py
          python3 tests/test_text_size_layout.py
          python3 tests/test_host_ota.py
          node tests/test_board_diagnostics_web.js
          node tests/test_web_shell.js
          g++ -std=c++17 -Wall -Wextra -Werror -Imain tests/test_time_zones.cpp -o /tmp/test_time_zones
          /tmp/test_time_zones
          node tests/test_adventure_editor_web.js
          ADV_SAMPLE_DIR=/tmp/newadv node tests/test_adventure_model.js
          trap 'rm -f tests/.test_kara_lyrics' EXIT
          g++ -std=c++17 -Wall -Wextra -Werror -Imain -Itests tests/test_kara_lyrics.cpp main/kara_lyrics.cpp -o tests/.test_kara_lyrics
          tests/.test_kara_lyrics
          rm -f tests/.test_kara_lyrics
          g++ -std=c++17 -Wall -Wextra -Werror -Imain -Icomponents/otr_midi/include -Itests tests/test_karastream.cpp main/kara_stream.cpp components/otr_midi/otr_midi.cpp -o /tmp/test_karastream
          /tmp/test_karastream
          g++ -std=c++17 -Wall -Wextra -Werror -Imain -Itests tests/test_fspath.cpp main/fs_path.cpp -o /tmp/test_fspath
          /tmp/test_fspath
          g++ -std=c++17 -Wall -Wextra -Werror -Icomponents/my_time/include tests/test_time_crumb.cpp -o /tmp/test_time_crumb
          /tmp/test_time_crumb
          g++ -std=c++17 -Wall -Wextra -Werror -Imain -Itests tests/test_fs_upload.cpp main/fs_upload.cpp -o /tmp/test_fs_upload
          /tmp/test_fs_upload
          node tests/test_files_upload_web.js
          node tests/test_files_delete_web.js
          g++ -std=c++17 -Wall -Wextra -Werror -Imain -Icomponents/otr_engine/include -Icomponents/otr_story/include tests/test_adv_validator.cpp main/adv_validator.cpp main/adv_loader.cpp components/otr_engine/otr_world.cpp components/otr_story/otr_story.cpp -o /tmp/test_adv_validator
          /tmp/test_adv_validator
          /tmp/test_adv_validator /tmp/newadv/*.adv

      - name: Read firmware version
        id: firmware
        run: |
          version=$(sed -n 's/^set(PROJECT_VER "\([0-9]*\.[0-9]*\.[0-9]*\)")$/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build with ESP-IDF v6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: ${{ matrix.target }}
          command: |
            set -eu
            idf.py --version
            idf.py -D SDKCONFIG_DEFAULTS="${{ matrix.defaults }}" set-target ${{ matrix.target }}
            if [ "${{ matrix.board }}" = s3-35b ]; then
              grep -qx 'CONFIG_OTR_HW_PROFILE_S3_35B=y' sdkconfig
              grep -qx "# CONFIG_OTR_S3_TOUCH_DIAGNOSTICS is not set" sdkconfig
            fi
            grep -qx 'CONFIG_LOG_DEFAULT_LEVEL=3' sdkconfig
            grep -qx 'CONFIG_LOG_MAXIMUM_LEVEL=4' sdkconfig
            grep -qx 'CONFIG_LOG_DYNAMIC_LEVEL_CONTROL=y' sdkconfig
            idf.py build
            python3 tools/check_firmware_board.py build/MyEsp_OnTheRoad.bin ${{ matrix.identity }}
            idf.py merge-bin -o merged.bin

      - name: Test display, touch and UI layouts (host LVGL)
        if: matrix.board == 'es3c35p'
        run: |
          python3 tests/test_pointer_click.py /tmp/pointer-click
          python3 tests/test_s3_35b_display_touch.py
          g++ -std=c++17 -Wall -Wextra -Werror -Imain tests/test_touch_test_math.cpp -o /tmp/test_touch_test_math
          /tmp/test_touch_test_math
          python3 tests/test_sudoku_ui.py /tmp/sudoku-ui
          python3 tests/test_adv_game_layout.py /tmp/adventure-layout
          python3 tests/test_yatzy_layout.py /tmp/menu-layout
          python3 tests/test_karaoke_layout.py /tmp/karaoke-layout
          g++ -std=c++17 -Wall -Wextra -Werror -Imain tests/test_karaoke_geometry.cpp -o /tmp/test_karaoke_geometry
          /tmp/test_karaoke_geometry

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}-${{ matrix.board }}-v${{ steps.firmware.outputs.version }}${{ matrix.label }}
          path: |
            build/merged.bin
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
            dependencies.lock.${{ matrix.target }}
          if-no-files-found: warn
