name: Build firmware

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: es3c35p
            target: esp32s3
            label: ""
          - board: p4-43
            target: esp32p4
            label: "-unverified"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test release tooling (no publication)
        if: matrix.target == 'esp32s3'
        run: python3 -m unittest discover -s tests -p test_firmware_release.py

      - name: Test board peripherals (host)
        if: matrix.target == 'esp32s3'
        run: |
          python3 tests/test_board_peripherals.py
          python3 tests/test_flash_repair.py
          python3 tests/test_diag_mac.py
          python3 tests/test_ota_stream.py
          python3 tests/test_screen_power.py
          node tests/test_board_diagnostics_web.js

      - name: Read firmware version
        id: firmware
        run: |
          version=$(sed -n 's/^set(PROJECT_VER "\([0-9]*\.[0-9]*\.[0-9]*\)")$/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build with ESP-IDF v6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: ${{ matrix.target }}
          command: |
            idf.py --version
            idf.py set-target ${{ matrix.target }}
            idf.py build
            idf.py merge-bin -o merged.bin

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}-v${{ steps.firmware.outputs.version }}${{ matrix.label }}
          path: |
            build/merged.bin
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
            dependencies.lock.${{ matrix.target }}
          if-no-files-found: warn
