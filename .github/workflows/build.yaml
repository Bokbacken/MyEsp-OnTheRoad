name: Build firmware

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test release tooling (no publication)
        run: python3 -m unittest discover -s tests -p test_firmware_release.py

      - name: Read firmware version
        id: firmware
        run: |
          version=$(sed -n 's/^set(PROJECT_VER "\([0-9]*\.[0-9]*\.[0-9]*\)")$/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build with ESP-IDF v6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          command: |
            idf.py --version
            idf.py set-target esp32s3
            idf.py build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3-v${{ steps.firmware.outputs.version }}
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: warn
