<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnTheRoad – Live</title>
<link rel="stylesheet" href="/style.css">
<style>
.live-top { display: flex; flex-wrap: wrap; gap: .6rem 1.2rem; align-items: baseline; }
.live-top .stat { font-size: 1.3rem; }
.turn { font-size: 1.15rem; margin: .3rem 0 .2rem; }
.turn b { color: var(--otr-orange); }
/* Die size for this page */
.dice { min-height: 4.5rem; gap: .7rem; }
.die-wrap { width: 4rem; height: 4rem; }
#felt { min-height: min(60vw, 360px); }
.score th, .score td { width: auto; text-align: center; white-space: nowrap; padding: .35rem .45rem; }
.score th:first-child, .score td:first-child { text-align: left; }
.score thead th { color: var(--otr-text); }
.score .cur { background: rgba(255, 156, 61, .14); }
.score thead .cur { box-shadow: inset 0 -3px 0 var(--otr-orange); }
.score .sum td { font-weight: 700; border-top: 2px solid var(--otr-line); }
.score .total td { font-weight: 700; font-size: 1.1rem; color: var(--otr-orange); }
.score .empty { color: var(--otr-line); }
.score .zero { color: var(--otr-muted); }
.winner { font-size: 1.3rem; font-weight: 700; color: var(--otr-green); }
.full { position: fixed; right: .8rem; bottom: .8rem; }
/* Wide screens: web-play banner across, game status left, score sheet (heading + table) right */
@media (min-width: 900px) {
  body { max-width: 78rem; }
  #game { display: grid; grid-template-columns: minmax(24rem, 36rem) 1fr; gap: 0 1.2rem; align-items: start; }
  #game #webplay { grid-column: 1 / -1; }
  #game > .card:not(#webplay):not(.table-wrap) { grid-column: 1; grid-row: 2 / span 2; }
  #game > h2 { grid-column: 2; grid-row: 2; margin: 0 0 .5rem; }
  #game > .table-wrap { grid-column: 2; grid-row: 3; min-width: 0; }
}
</style>
</head>
<body>
<header class="otr-brand">
  <div class="otr-head">
    <div class="otr-logo">&#9856;</div>
    <div class="otr-project">ONTHEROAD<small data-t="sub">Live-spel</small></div>
    <div class="otr-wifi"><span class="dot" id="live-dot"></span><span id="live-text" data-t="loading">hämtar...</span></div>
  </div>
</header>
<nav class="otr-nav">
  <a href="/" data-t="nav_home">Översikt</a>
  <a href="/game" class="active">Live</a>
  <a href="/players" data-t="nav_players">Spelare</a>
  <a href="/settings" data-t="nav_settings">Inställningar</a>
  <a href="/diag" data-t="nav_diag">Diagnostik</a>
  <a href="/update" data-t="nav_update">Uppdatera</a>
</nav>

<div id="idle" class="card" hidden>
  <h3 data-t="idle">Inget spel pågår</h3>
  <p class="muted" data-t="idle_hint">Starta Yatzy eller Maxi-Yatzy på enheten – sidan uppdateras automatiskt.</p>
</div>

<div id="game" hidden>
  <div class="card" id="webplay" hidden>
    <div><b data-t="web_title">Spela via webben</b> · <span class="muted" data-t="web_hint">välj ditt namn och ange din PIN</span></div>
    <div><a id="weblink" href="#">–</a></div>
    <div class="muted" id="webwho"></div>
  </div>
  <div class="card">
    <div class="live-top">
      <div class="stat" id="variant">–</div>
      <div class="muted" id="round">–</div>
    </div>
    <div class="turn" id="turn">–</div>
    <div id="felt"><div class="dice" id="dice"></div></div>
    <div class="muted" id="rolls">–</div>
    <div class="winner" id="winner" hidden></div>
  </div>
  <h2 id="proto-h" data-t="protocol">Protokoll</h2>
  <div class="card table-wrap">
    <table class="score" id="score"></table>
  </div>
</div>

<button class="secondary full" id="fs" title="Helskärm">⛶</button>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const T = {
  sv: {sub: 'Live-spel', loading: 'hämtar...', nav_home: 'Översikt', nav_players: 'Spelare', nav_settings: 'Inställningar',
       nav_diag: 'Diagnostik', nav_update: 'Uppdatera', idle: 'Inget spel pågår',
       idle_hint: 'Starta Yatzy eller Maxi-Yatzy på enheten – sidan uppdateras automatiskt.', protocol: 'Protokoll',
       web_title: 'Spela via webben', web_hint: 'välj ditt namn och ange din PIN', over: 'Spelet är slut', round: 'Omgång {0} av {1}', final: 'Slutresultat',
       turn: 'Tur', rolling: 'tärningarna rullar...', shaking: 'skakar bägaren...', choosing: 'väljer ruta',
       rolls: 'Kast kvar: {0}', saved: ' (varav {0} sparade)', shared: 'Delad vinst: ', winner: 'Vinnare: ',
       sum: 'Summa', total: 'Totalt', live: 'live', nocontact: 'ingen kontakt', connected: 'ansluten', waiting: 'väntar', web_playing: '{0} spelar via webben',
       fs: 'Helskärm'},
  en: {sub: 'Live game', loading: 'loading...', nav_home: 'Overview', nav_players: 'Players', nav_settings: 'Settings',
       nav_diag: 'Diagnostics', nav_update: 'Update', idle: 'No game running',
       idle_hint: 'Start Yatzy or Maxi Yatzy on the device – the page updates automatically.', protocol: 'Score sheet',
       web_title: 'Play via the web', web_hint: 'pick your name and enter your PIN', over: 'The game is over', round: 'Round {0} of {1}', final: 'Final result',
       turn: 'Turn', rolling: 'dice rolling...', shaking: 'shaking the cup...', choosing: 'choosing a box',
       rolls: 'Rolls left: {0}', saved: ' ({0} saved)', shared: 'Shared win: ', winner: 'Winner: ',
       sum: 'Sum', total: 'Total', live: 'live', nocontact: 'no contact', connected: 'connected', waiting: 'waiting', web_playing: '{0} playing via the web',
       fs: 'Full screen'}
};
// v0.6.0: Pig / Farkle / Ship-Captain-Crew
Object.assign(T.sv, {idle_hint: 'Starta ett spel på enheten – sidan uppdateras automatiskt.', standings: 'Poängställning',
  round_n: 'Omgång {0}', target: 'mål {0} p', turn_total: 'Rundans poäng: {0}', bust: 'Etta – rundans poäng förlorade',
  lost_all: 'Dubbla ettor – allt nollställt', farkle: 'Farkle – inga poäng', final_round: 'Sista omgången', opened: 'Öppnad',
  ship: 'Skepp', captain: 'Kapten', crew: 'Besättning', cargo: 'Last {0}', player: 'Spelare', points: 'Poäng'});
Object.assign(T.en, {idle_hint: 'Start a game on the device – the page updates automatically.', standings: 'Standings',
  round_n: 'Round {0}', target: 'target {0} pts', turn_total: 'Turn total: {0}', bust: 'A one – turn total lost',
  lost_all: 'Double ones – everything reset', farkle: 'Farkle – no points', final_round: 'Final round', opened: 'Opened',
  ship: 'Ship', captain: 'Captain', crew: 'Crew', cargo: 'Cargo {0}', player: 'Player', points: 'Points'});
let L = 'sv';
const t = (k, ...a) => ((T[L] || T.sv)[k] || T.sv[k] || k).replace(/\{(\d)\}/g, (m, i) => a[i]);
function setLang(l) {
  if (!T[l] || l === L) return;
  L = l;
  document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
  $('fs').title = t('fs');
}

let ver = -1, last = null, fails = 0;

// ── 3D Dice engine ────────────────────────────────────────────────────────
const PIPS3D = {
  1: [[50,50]],
  2: [[28,28],[72,72]],
  3: [[28,28],[50,50],[72,72]],
  4: [[28,28],[72,28],[28,72],[72,72]],
  5: [[28,28],[72,28],[50,50],[28,72],[72,72]],
  6: [[28,26],[72,26],[28,50],[72,50],[28,74],[72,74]]
};
// Face name → value shown on that face (opposite faces sum to 7)
const FACE_VAL = {front:1, back:6, right:2, left:5, top:3, bottom:4};
// Value → [rotX, rotY] to bring that face to face the viewer
const FACE_ROT = {1:[0,0], 2:[0,-90], 3:[-90,0], 4:[90,0], 5:[0,90], 6:[0,180]};

let _dieRx = [], _dieRy = [];
let _dieVal = [];               // Last value each die was turned to (0 = unrolled / spinning)
let _dieRot = [];               // Scatter on the felt: 2D tilt (deg)
let _dieX = [], _dieY = [];     // Scatter on the felt: top-left position (% of felt)
let _diePlaced = [];            // Die has been given a felt spot (avoids stacking at the start position)
let _rollAnim = null;
let _dieSz = 3.5, _dieHalf = 1.75;  // rem; overridden per page

const FACE_NAMES = ['front','back','right','left','top','bottom'];
function _faceTransform(name) {
  const h = _dieHalf;
  return {
    front:  `translateZ(${h}rem)`,
    back:   `rotateY(180deg) translateZ(${h}rem)`,
    right:  `rotateY(90deg) translateZ(${h}rem)`,
    left:   `rotateY(-90deg) translateZ(${h}rem)`,
    top:    `rotateX(90deg) translateZ(${h}rem)`,
    bottom: `rotateX(-90deg) translateZ(${h}rem)`,
  }[name];
}

function buildDice3D(container, n) {
  // Only rebuild if count changed
  if (container.children.length === n) return;
  container.innerHTML = '';
  _dieRx = Array(n).fill(0);
  _dieRy = Array(n).fill(0);
  _dieVal = Array(n).fill(0);
  _dieRot = Array(n).fill(0);
  _dieX = Array(n).fill(50);
  _dieY = Array(n).fill(40);
  _diePlaced = Array(n).fill(false);
  const sz = _dieSz;
  for (let i = 0; i < n; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'die-wrap';
    wrap.dataset.i = String(i);
    wrap.style.position = 'absolute';
    wrap.style.left = '50%';
    wrap.style.top = '40%';
    const d3 = document.createElement('div');
    d3.className = 'die-3d';
    d3.style.width = sz + 'rem';
    d3.style.height = sz + 'rem';
    FACE_NAMES.forEach(name => {
      const f = document.createElement('div');
      f.className = 'face ' + name;
      f.style.transform = _faceTransform(name);
      const val = FACE_VAL[name];
      const pip_sz = Math.round(sz * 18 / 3.5 * 10) / 10;  // scale pips with die size
      f.innerHTML = (PIPS3D[val] || []).map(([x,y]) =>
        `<span style="left:${x}%;top:${y}%;width:${pip_sz}%;height:${pip_sz}%"></span>`).join('');
      d3.appendChild(f);
    });
    wrap.appendChild(d3);
    container.appendChild(wrap);
  }
}

function _d3(container, i) {
  const w = container.children[i];
  return w ? w.querySelector('.die-3d') : null;
}

const SCATTER_MAX_ROT = 18;   // Spectator view: fixed 'normal' scatter, no cup

// Place a die on the felt. `reroll` picks a new random spot + tilt (only when it lands with a new
// value); otherwise the stored scatter is reused so hold/release and re-renders never jitter.
// Spots come from a jittered grid (one cell per die) so dice never pile on top of each other.
// Held dice stay on the felt here (orange glow via .held-wrap).
function applyScatter(container, i, isHeld, reroll = false) {
  const wrap = container.children[i];
  if (!wrap) return;
  if (reroll || !_diePlaced[i]) {   // New spot on landing, or first time shown
    _diePlaced[i] = true;
    _dieRot[i] = (Math.random() * 2 - 1) * SCATTER_MAX_ROT;
    const n = container.children.length;
    const cols = Math.min(n, 5), rows = Math.ceil(n / cols);
    const col = i % cols, row = Math.floor(i / cols);
    const cellW = 74 / cols, cellH = 68 / rows;
    _dieX[i] = 5 + col * cellW + Math.random() * Math.max(cellW - 16, 2) + 4;
    _dieY[i] = 6 + row * cellH + Math.random() * Math.max(cellH - 16, 2) + 4;
    _dieX[i] = Math.max(3, Math.min(80, _dieX[i]));
    _dieY[i] = Math.max(4, Math.min(78, _dieY[i]));
  }
  wrap.style.left = _dieX[i] + '%';
  wrap.style.top = _dieY[i] + '%';
  wrap.style.transform = `rotate(${_dieRot[i].toFixed(1)}deg)`;
}

function setDieValue(container, i, val, held) {
  const wrap = container.children[i];
  if (!wrap) return;
  // Skip rotation animation if value unchanged (prevents spin-on-hold bug)
  const prevVal = _dieVal[i] || 0;
  _dieVal[i] = val || 0;
  const valueChanged = val !== prevVal;
  const d3 = wrap.querySelector('.die-3d');
  wrap.classList.toggle('held-wrap', !!held);
  wrap.classList.toggle('unrolled', !val);
  d3.classList.toggle('held-3d', !!held);
  if (val && valueChanged) {
    d3.classList.add('landing');
    const [bx, by] = FACE_ROT[val] || [0, 0];
    // Always approach the target face along the shortest path (max 180° per axis)
    const cRx = _dieRx[i] % 360;
    const cRy = _dieRy[i] % 360;
    const dRx = ((bx - cRx) + 540) % 360 - 180;
    const dRy = ((by - cRy) + 540) % 360 - 180;
    _dieRx[i] = _dieRx[i] + dRx;
    _dieRy[i] = _dieRy[i] + dRy;
    d3.style.transform = `rotateX(${_dieRx[i]}deg) rotateY(${_dieRy[i]}deg)`;
  }
  applyScatter(container, i, held, !!val && valueChanged);
}

function startRollingAnim(container, rollingIdx, spinFactor = 1.0) {
  if (_rollAnim) return;
  rollingIdx.forEach(i => {
    const d3 = _d3(container, i);
    if (d3) d3.classList.remove('landing');   // Snappy spinning
    // Straighten while spinning (keeps its spot; it glides to a new one when it lands)
    const wrap = container.children[i];
    if (wrap) wrap.style.transform = 'rotate(0deg)';
    // Forget the old value: the die must land (and re-scatter) even if it shows the same face again
    _dieVal[i] = 0;
  });
  const baseSpeed = 95 / spinFactor;
  _rollAnim = setInterval(() => {
    rollingIdx.forEach(i => {
      _dieRx[i] += (80 + Math.random() * 200) * spinFactor;
      _dieRy[i] += (80 + Math.random() * 200) * spinFactor;
      const d3 = _d3(container, i);
      if (d3) d3.style.transform = `rotateX(${_dieRx[i]}deg) rotateY(${_dieRy[i]}deg)`;
    });
  }, Math.round(baseSpeed));
}

function stopRollingAnim() {
  if (_rollAnim) { clearInterval(_rollAnim); _rollAnim = null; }
}
// ── End 3D Dice engine ────────────────────────────────────────────────────
_dieSz = 4; _dieHalf = 2;

function render(g) {
  last = g;
  if (g.lang) setLang(g.lang);
  $('idle').hidden = g.active;
  $('game').hidden = !g.active;
  if (!g.active) return;
  const P = g.players;
  const wp = g.web_players || [];
  // Any seat can be played from /play (v0.5.7): show the link for every running game
  $('webplay').hidden = g.finished;
  const url = location.protocol + '//' + location.host + '/play';
  $('weblink').href = url;
  $('weblink').textContent = url;
  const connected = wp.filter(w => w.connected);
  $('webwho').textContent = connected.length
    ? t('web_playing', connected.map(w => (P[w.player] || {name: '?'}).name).join(', ')) : '';
  $('variant').textContent = g.name;
  if (g.game_type && g.game_type !== 'yatzy') { renderOther(g); return; }
  $('proto-h').textContent = t('protocol');
  $('round').textContent = g.finished ? t('over') : t('round', g.round, g.rounds);
  const cur = P[g.current] || {name: '?'};
  $('turn').innerHTML = g.finished ? t('final') : t('turn') + ': <b>' + esc(cur.name) + '</b>' + (cur.web ? ' 📶' : '') +
    (g.rolling ? ' <span class="muted">· ' + t('rolling') + '</span>' : g.shaking ? ' <span class="muted">· ' + t('shaking') + '</span>' : g.choosing ? ' <span class="muted">· ' + t('choosing') + '</span>' : '');
  if (g.finished) {
    stopRollingAnim(); $('dice').innerHTML = ''; _dieRx = []; _dieRy = []; _dieVal = []; _dieRot = []; _dieX = []; _dieY = []; _diePlaced = [];
  } else {
    buildDice3D($('dice'), g.dice.length);
    const rolling = g.rolling || g.shaking;
    if (rolling) {
      const rollingIdx = g.dice.map((_, i) => (g.roll_mask ? g.roll_mask[i] : !g.held[i]) ? i : -1).filter(i => i >= 0);
      startRollingAnim($('dice'), rollingIdx);
    } else {
      stopRollingAnim();
      g.dice.forEach((v, i) => setDieValue($('dice'), i, v, g.held[i]));
    }
  }
  let rolls = g.finished ? '' : t('rolls', g.rolls_left);
  if (!g.finished && cur.saved_rolls) rolls += t('saved', cur.saved_rolls);
  $('rolls').textContent = rolls;

  const w = $('winner');
  w.hidden = !g.finished;
  if (g.finished && g.ranking) {
    const first = g.ranking.filter(r => r.place === 1).map(r => esc(P[r.player].name));
    w.innerHTML = (first.length > 1 ? t('shared') : t('winner')) + first.join(' & ') + ' 🏆<div class="muted" style="font-size:1rem;font-weight:500">' +
      g.ranking.map(r => r.place + '. ' + esc(P[r.player].name) + ' ' + P[r.player].total).join(' · ') + '</div>';
  }

  const cc = i => (!g.finished && i === g.current) ? ' class="cur"' : '';
  const cell = v => v === null ? '<td class="empty">·</td>' : v === 0 ? '<td class="zero">–</td>' : '<td>' + v + '</td>';
  let h = '<thead><tr><th></th>' + P.map((p, i) => '<th' + cc(i) + '>' + esc(p.name) + '</th>').join('') + '</tr></thead><tbody>';
  let upperDone = false;
  g.categories.forEach((c, k) => {
    if (!c.upper && !upperDone) {
      upperDone = true;
      h += '<tr class="sum"><td>' + t('sum') + '</td>' + P.map((p, i) => '<td' + cc(i) + '>' + p.upper + '</td>').join('') + '</tr>';
      h += '<tr><td>Bonus <span class="muted">(' + g.bonus_threshold + ')</span></td>' +
        P.map((p, i) => '<td' + cc(i) + '>' + (p.bonus ? '<span class="ok">' + p.bonus + '</span>' : '<span class="muted">' + (p.upper - g.bonus_threshold) + '</span>') + '</td>').join('') + '</tr>';
    }
    h += '<tr><td>' + esc(c.name) + '</td>' + P.map((p, i) => cell(p.scores[k]).replace('<td', '<td' + cc(i))).join('') + '</tr>';
  });
  h += '<tr class="total sum"><td>' + t('total') + '</td>' + P.map((p, i) => '<td' + cc(i) + '>' + p.total + '</td>').join('') + '</tr></tbody>';
  $('score').innerHTML = h;
}

// v0.6.0: read-only view of Pig / Farkle / Ship-Captain-Crew (held dice glow on the felt, as for Yatzy)
function renderOther(g) {
  const P = g.players, gt = g.game_type, cur = P[g.current] || {name: '?'};
  $('proto-h').textContent = t(gt === 'scc' ? 'protocol' : 'standings');
  $('round').textContent = g.finished ? t('over') : gt === 'scc' ? t('round', g.round, g.rounds)
    : t('round_n', g.round) + ' · ' + t('target', g.target) + (g.final_round ? ' · ' + t('final_round') : '');
  $('turn').innerHTML = g.finished ? t('final') : t('turn') + ': <b>' + esc(cur.name) + '</b>' + (cur.web ? ' 📶' : '') +
    (g.rolling ? ' <span class="muted">· ' + t('rolling') + '</span>' : '');
  const air = i => !!(g.rolling && g.roll_mask && g.roll_mask[i]);   // v0.7.1: in the air, value unknown
  const held = i => !!(g.held && g.held[i]) && !air(i);
  if (g.finished) {
    stopRollingAnim(); $('dice').innerHTML = ''; _dieRx = []; _dieRy = []; _dieVal = []; _dieRot = []; _dieX = []; _dieY = []; _diePlaced = [];
  } else {
    buildDice3D($('dice'), g.dice.length);
    if (g.rolling) startRollingAnim($('dice'), g.dice.map((_, i) => (g.roll_mask ? air(i) : !held(i)) ? i : -1).filter(i => i >= 0));
    else { stopRollingAnim(); g.dice.forEach((v, i) => setDieValue($('dice'), i, v, held(i))); }
  }
  let st = '';
  if (!g.finished) {
    if (gt === 'pig') st = g.busted ? t(g.lost_all ? 'lost_all' : 'bust') : t('turn_total', g.turn_total);
    else if (gt === 'farkle') st = g.farkled ? t('farkle') : t('turn_total', g.turn_total + (g.held_score || 0));
    else st = [g.ship && t('ship'), g.captain && t('captain'), g.crew && t('crew'), g.crew && t('cargo', g.cargo)].filter(Boolean).join(' · ') +
      (g.has_rolled ? (g.ship ? ' · ' : '') + t('rolls', g.rolls_left) : '');
  }
  $('rolls').textContent = st;
  const w = $('winner');
  w.hidden = !g.finished;
  if (g.finished && g.ranking) {
    const first = g.ranking.filter(r => r.place === 1).map(r => esc(P[r.player].name));
    w.innerHTML = (first.length > 1 ? t('shared') : t('winner')) + first.join(' & ') + ' 🏆<div class="muted" style="font-size:1rem;font-weight:500">' +
      g.ranking.map(r => r.place + '. ' + esc(P[r.player].name) + ' ' + P[r.player].total).join(' · ') + '</div>';
  }
  const cc = i => (!g.finished && i === g.current) ? ' class="cur"' : '';
  let h;
  if (gt === 'scc') {
    h = '<thead><tr><th></th>' + P.map((p, i) => '<th' + cc(i) + '>' + esc(p.name) + '</th>').join('') + '</tr></thead><tbody>';
    for (let k = 0; k < g.rounds; k++)
      h += '<tr><td>' + t('round_n', k + 1) + '</td>' + P.map((p, i) => {
        const v = (p.scores || [])[k];
        return '<td' + cc(i) + '>' + (v === undefined ? '<span class="empty">·</span>' : v === 0 ? '<span class="zero">–</span>' : v) + '</td>';
      }).join('') + '</tr>';
    h += '<tr class="total sum"><td>' + t('total') + '</td>' + P.map((p, i) => '<td' + cc(i) + '>' + p.total + '</td>').join('') + '</tr></tbody>';
  } else {
    h = '<thead><tr><th>' + t('player') + '</th><th>' + t('points') + '</th>' + (gt === 'farkle' ? '<th>' + t('opened') + '</th>' : '') + '</tr></thead><tbody>';
    P.forEach((p, i) => {
      const pct = Math.max(0, Math.min(100, Math.round(100 * p.total / (g.target || 1))));
      h += '<tr' + cc(i) + '><td>' + esc(p.name) + '</td><td><b>' + p.total + '</b><div class="bar"><i style="width:' + pct + '%"></i></div></td>' +
        (gt === 'farkle' ? '<td>' + (p.opened ? '<span class="ok">&#10003;</span>' : '<span class="muted">–</span>') + '</td>' : '') + '</tr>';
    });
    h += '</tbody>';
  }
  $('score').innerHTML = h;
}

async function poll() {
  try {
    const r = await fetch('/api/game?v=' + ver, {cache: 'no-store'});
    const g = await r.json();
    fails = 0;
    $('live-dot').className = 'dot ok';
    $('live-text').textContent = t('live');
    if (!g.same) { ver = g.version; render(g); }
  } catch (e) {
    if (++fails > 2) { $('live-dot').className = 'dot bad'; $('live-text').textContent = t('nocontact'); }
  }
  setTimeout(poll, 700);
}
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
poll();
</script>
</body>
</html>
