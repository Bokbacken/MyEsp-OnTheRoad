<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnTheRoad – Play</title>
<link rel="stylesheet" href="/style.css">
<style>
body { max-width: 34rem; }
.turn { font-size: 1.15rem; margin: .2rem 0; }
.turn b { color: var(--otr-orange); }
.mine { color: var(--otr-green); font-weight: 700; }
/* Die size for this page */
.dice { min-height: 4rem; }
.die-wrap { width: 3.5rem; height: 3.5rem; }
/* Clickable cells in score table */
.score td.pot { cursor: pointer; font-weight: 600; color: var(--otr-gold, #d4b400);
  border-left: 3px solid var(--otr-gold, #d4b400); background: rgba(212,180,0,.09); }
.score td.pot-zero { cursor: pointer; color: var(--otr-muted);
  border-left: 3px solid rgba(200,60,50,.45); background: rgba(200,60,50,.06); }
.score td.pot.sel, .score td.pot-zero.sel { border-color: var(--otr-orange);
  background: rgba(255,156,61,.15); color: var(--otr-orange); font-weight: 700; }
.big { width: 100%; font-size: 1.25rem; padding: .8rem; margin: .3rem 0; }
.seats button { width: 100%; margin: .3rem 0; display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; }
.seats .tag { font-size: .85rem; opacity: .85; }
.score th, .score td { width: auto; text-align: center; white-space: nowrap; padding: .3rem .4rem; font-size: .9rem; }
.score th:first-child, .score td:first-child { text-align: left; }
.score .cur { background: rgba(255, 156, 61, .14); }
.score .sum td { font-weight: 700; border-top: 2px solid var(--otr-line); }
.msg { min-height: 1.3rem; }
/* PIN pad (overlay) */
.pad-bg { position: fixed; inset: 0; background: rgba(5, 10, 18, .85); display: flex; align-items: center; justify-content: center; z-index: 10; }
.pad { width: min(22rem, 94vw); background: var(--otr-panel); border: 1px solid var(--otr-line); border-radius: 1rem; padding: 1rem; }
.pad h3 { margin: 0 0 .6rem; text-align: center; }
.pin-cells { display: flex; gap: .6rem; justify-content: center; margin: .4rem 0 .3rem; }
.pin-cells span { width: 3rem; height: 3.4rem; border: 2px solid var(--otr-line); border-radius: .6rem; display: flex;
  align-items: center; justify-content: center; font-size: 2rem; background: var(--otr-panel-raised); }
.pin-cells span.cur { border-color: var(--otr-orange); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-top: .4rem; }
.keys button { font-size: 1.6rem; padding: .7rem 0; margin: 0; }
.pad .row { margin-top: .6rem; display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.pad .row button { margin: 0; }
.pad .msg { text-align: center; }
/* Wide / landscape screens: play column + full score sheet side by side */
@media (min-width: 900px) {
  body { max-width: 78rem; }
  #live { display: grid; grid-template-columns: minmax(22rem, 30rem) 1fr; gap: 1rem; align-items: start; }
  #live > .col { min-width: 0; }
  #live .score th, #live .score td { font-size: 1rem; padding: .35rem .6rem; }
  #seats { max-width: 36rem; }
  #seat-list { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }
  #seat-list button { margin: 0; }
}
</style>
</head>
<body>
<header class="otr-brand">
  <div class="otr-head">
    <div class="otr-logo">&#9856;</div>
    <div class="otr-project">ONTHEROAD<small data-t="sub">Webbspel</small></div>
    <div class="otr-wifi"><span class="dot" id="dot"></span><span id="conn" data-t="connecting">ansluter...</span></div>
  </div>
</header>

<!-- 1. No game running -->
<div id="lobby" class="card" hidden>
  <h3 data-t="no_game_t">Inget spel pågår</h3>
  <p class="muted" id="lobby-msg" data-t="no_game">Starta ett spel på enheten och markera dina spelare med webbknappen. Sidan uppdateras av sig själv.</p>
  <p><a href="/" data-t="home">Till startsidan</a></p>
</div>

<!-- 2. Seat: which web player am I? -->
<div id="seats" class="card seats" hidden>
  <h3 data-t="who">Vem spelar du?</h3>
  <p class="muted" data-t="who_hint">Tryck på ditt namn och ange din PIN.</p>
  <div id="seat-list"></div>
  <button class="secondary" id="watch" data-t="watch">Titta bara</button>
  <p class="msg bad" id="seat-msg"></p>
</div>

<!-- 3. Live: dice, roll, boxes | score sheet -->
<div id="live" hidden>
  <div class="col">
    <div class="card">
      <div class="muted" id="info">–</div>
      <div class="turn" id="turn">–</div>
      <div id="felt">
        <div id="cup-wrap" hidden>
          <div id="cup">
            <div class="cup-zone" data-zone="top"></div>
            <div class="cup-zone" data-zone="mid"></div>
            <div class="cup-zone" data-zone="bot"></div>
          </div>
          <div id="cup-info"></div>
        </div>
        <div class="dice" id="dice"></div>
      </div>
      <div class="dice" id="held-tray"></div>
      <div class="muted" id="hint" style="text-align:center"></div>
      <button class="primary big" id="roll" disabled>–</button>
      <p class="msg bad" id="live-msg"></p>
    </div>
  </div>
  <div class="col">
    <h2 data-t="protocol">Protokoll</h2>
    <div class="card table-wrap"><table class="score" id="score"></table></div>
    <div class="row"><button class="secondary" id="leave" data-t="leave">Byt spelare</button></div>
    <div class="row" id="device-row"><button class="secondary" id="device" data-t="device">Fortsätt på enheten</button></div>
  </div>
</div>

<!-- PIN pad -->
<div class="pad-bg" id="pad" hidden>
  <div class="pad">
    <h3 id="pad-title">PIN</h3>
    <div class="pin-cells" id="pin-cells"><span></span><span></span><span></span><span></span></div>
    <p class="msg bad" id="pad-msg"></p>
    <div class="keys" id="keys">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button data-k="del" class="secondary">&#9003;</button><button>0</button><span></span>
    </div>
    <div class="row">
      <button class="secondary" id="pad-cancel" data-t="cancel">Avbryt</button>
      <button class="primary" id="pad-ok" disabled>OK</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const T = {
  sv: {sub: 'Webbspel', connecting: 'ansluter...', online: 'ansluten', offline: 'ingen kontakt – försöker igen',
       no_game_t: 'Inget spel pågår', home: 'Till startsidan',
       no_game: 'Starta ett spel på enheten och markera dina spelare med webbknappen. Sidan uppdateras av sig själv.',
       who: 'Vem spelar du?', who_hint: 'Tryck på ditt namn och ange din PIN.', watch: 'Titta bara',
       choose: 'Välj ruta', protocol: 'Protokoll', leave: 'Byt spelare', cancel: 'Avbryt',
       no_web: 'Ingen spelare är markerad som webbspelare. Du kan titta på spelet.',
       connected_tag: 'ansluten', nopin_tag: 'ingen PIN', rejoin_tag: 'sparad', pin_for: 'PIN för {0}',
       expired: 'Ett nytt spel har startat – välj ditt namn igen.',
       round: 'Omgång {0} av {1}', turn: 'Tur', you: 'din tur!', spectator: 'Du tittar', playing_as: 'Du spelar som {0}',
       roll: 'Kasta ({0} kvar)', cup_left: '{0} kast kvar', cup_one: '1 kast kvar', cup_gentle: 'Försiktigt kast', cup_normal: 'Vanligt kast', cup_vigorous: 'Kraftigt kast', roll_none: 'Inga kast kvar', wait: 'Väntar på {0}...', rolling: 'Tärningarna rullar...',
       tap_hold: 'Tryck på en tärning för att hålla / släppa den.', pick_score: 'Välj ruta i protokollet nedan', write: 'Skriv {0} p på {1}', pick: 'Välj en ruta',
       sum: 'Summa', total: 'Totalt', over: 'Spelet är slut', winner: 'Vinnare: {0}',
       err_nogame: 'Inget spel pågår.', err_seat: 'Den platsen spelas inte via webben.',
       err_pin: 'Fel PIN – försök igen.', err_nopin: 'Spelaren har ingen PIN – välj en ny.',
       create_pin: 'Välj PIN för {0}', confirm_pin: 'Bekräfta PIN', pin_no_match: 'PIN stämmer inte – börja om', device: 'Fortsätt på enheten', leaving: 'Kopplar från...', err_pinexists: 'Spelaren har redan en PIN. Ändra via /players.', err_badpin: 'Ogiltig PIN (4 siffror krävs).',
       err_locked: 'För många fel PIN – försök igen om {0} s.',
       err_join: 'Välj ditt namn och ange PIN först.', err_full: 'För många webbklienter (max 4).', err_turn: 'Det är inte din tur.',
       err_cmd: 'Kommandot kunde inte utföras.', joining: 'Ansluter...', err_wait: 'Ingen kontakt med enheten än, försök igen om en sekund.'},
  en: {sub: 'Web play', connecting: 'connecting...', online: 'connected', offline: 'no contact – retrying',
       no_game_t: 'No game running', home: 'Home',
       no_game: 'Start a game on the device and mark your players with the web button. This page updates by itself.',
       who: 'Who are you playing?', who_hint: 'Tap your name and enter your PIN.', watch: 'Just watch',
       choose: 'Choose a box', protocol: 'Score sheet', leave: 'Change player', cancel: 'Cancel',
       no_web: 'No player is marked as a web player. You can watch the game.',
       connected_tag: 'connected', nopin_tag: 'no PIN', rejoin_tag: 'saved', pin_for: 'PIN for {0}',
       expired: 'A new game has started – pick your name again.',
       round: 'Round {0} of {1}', turn: 'Turn', you: 'your turn!', spectator: 'You are watching', playing_as: 'You play as {0}',
       roll: 'Roll ({0} left)', cup_left: '{0} rolls left', cup_one: '1 roll left', cup_gentle: 'Gentle throw', cup_normal: 'Normal throw', cup_vigorous: 'Vigorous throw', roll_none: 'No rolls left', wait: 'Waiting for {0}...', rolling: 'Dice rolling...',
       tap_hold: 'Tap a die to hold / release it.', pick_score: 'Tap a box in the score sheet below', write: 'Write {0} pts in {1}', pick: 'Choose a box',
       sum: 'Sum', total: 'Total', over: 'The game is over', winner: 'Winner: {0}',
       err_nogame: 'No game running.', err_seat: 'That seat is not played via the web.',
       err_pin: 'Wrong PIN – try again.', err_nopin: 'Player has no PIN – set one now.',
       create_pin: 'Choose PIN for {0}', confirm_pin: 'Confirm PIN', pin_no_match: 'PINs do not match – start over', device: 'Continue on device', leaving: 'Disconnecting...', err_pinexists: 'Player already has a PIN. Change it via /players.', err_badpin: 'Invalid PIN (must be 4 digits).',
       err_locked: 'Too many wrong PINs – try again in {0} s.',
       err_join: 'Pick your name and enter your PIN first.', err_full: 'Too many web clients (max 4).', err_turn: 'It is not your turn.',
       err_cmd: 'The command could not be executed.', joining: 'Connecting...', err_wait: 'No contact with the device yet, try again in a second.'}
};
let L = 'sv';
const t = (k, ...a) => ((T[L] || T.sv)[k] || T.sv[k] || k).replace(/\{(\d)\}/g, (m, i) => a[i]);
function setLang(l) {
  if (!T[l] || l === L) return;
  L = l;
  document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
}

// --- State ---------------------------------------------------------------------------------
// Protocol (v0.5.6): {"cmd":"join"} = watch; {"cmd":"join","player":seat,"pin":"1234"} = play.
// localStorage otr_play = {seat, name, pin}: automatic re-join while the same player is on that seat.
const params = new URLSearchParams(location.search);
const DEBUG = params.get('debug') === '1';   // ?debug=1 logs WS traffic to the console
let ws = null, g = null, you = -1, joined = false, sel = null, retry = 0;
const isMine = () => !!g && g.active && you >= 0 && you === g.current && !g.finished;
let mode = 'ask';          // ask = seat list, watch = spectator by choice, seat = joined/joining a seat
let pending = null;        // {seat, name, pin} join in flight
let padSeat = null, padName = '', pin = '';
let createMode = false, createPin1 = '';   // In-browser PIN creation (v0.5.7): enter twice, then setpin
const stored = () => { try { return JSON.parse(localStorage.getItem('otr_play') || 'null'); } catch (e) { return null; } };
const forget = () => localStorage.removeItem('otr_play');

function show(view) { ['lobby', 'seats', 'live'].forEach(v => $(v).hidden = v !== view); }
function send(o) {
  if (DEBUG) console.log('[WS out]', o.cmd === 'join' && o.pin ? Object.assign({}, o, {pin: '****'}) : o,
                          ws ? 'readyState=' + ws.readyState : 'no socket');
  if (ws && ws.readyState === 1) { ws.send(JSON.stringify(o)); return true; }
  return false;
}
const watchJoin = () => send({cmd: 'join'});
function seatJoin(seat, name, p) {
  pending = {seat, name, pin: p};
  mode = 'seat';
  if (!send({cmd: 'join', player: seat, pin: p})) { padMsg(t('err_wait')); pending = null; mode = 'ask'; }
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/game');
  ws.onopen = () => {
    retry = 0;
    joined = false;   // A new socket starts unbound
    $('dot').className = 'dot ok';
    $('conn').textContent = t('online');
    watchJoin();      // Spectator first: the state tells us who sits where
  };
  ws.onclose = () => {
    $('dot').className = 'dot bad';
    $('conn').textContent = t('offline');
    setTimeout(connect, Math.min(5000, 1000 + 1000 * retry++));
  };
  ws.onmessage = ev => {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (DEBUG) console.log('[WS in]', m);
    if (m.type === 'state') onState(m);
    else if (m.type === 'joined') onJoined(m);
    else if (m.type === 'error') onError(m);
  };
}

function onJoined(m) {
  you = m.you;
  joined = true;
  if (you >= 0 && pending && pending.seat === you) {
    localStorage.setItem('otr_play', JSON.stringify(pending));
    padClose();
  } else if (you === -1 && mode !== 'ask') {
    // "Continue on device": the seat is released, back to the seat list
    forget(); mode = 'ask';
    if (g && g.active) { renderSeats(); show('seats'); }
  }
  pending = null;
}

function onError(m) {
  const own = t('err_' + m.error, m.retry_s || '');
  const txt = own !== 'err_' + m.error ? own : m.msg;
  if (m.error === 'nogame') {
    joined = false;
    show('lobby');
  } else if (['pin', 'nopin', 'locked', 'seat', 'pinexists', 'badpin'].includes(m.error)) {
    // Join / setpin with a seat failed
    forget();
    const failSeat = pending ? pending.seat : padSeat !== null ? padSeat : -1;
    const failName = pending ? pending.name : padName;
    pending = null;
    mode = 'ask';
    const toSeats = () => { padClose(); $('seat-msg').textContent = txt; if (g && g.active) { renderSeats(); show('seats'); } };
    if (m.error === 'nopin') {
      // No PIN yet: let the player create one right here
      padClose();
      if (failSeat >= 0) padOpen(failSeat, failName, true);
      else toSeats();
    } else if (m.error === 'pinexists') {
      // Someone set a PIN meanwhile: switch to normal PIN entry
      if (failSeat >= 0) { padOpen(failSeat, failName, false); padMsg(txt); } else toSeats();
    } else if (m.error === 'badpin') {
      if (failSeat >= 0) { padOpen(failSeat, failName, true); padMsg(txt); } else toSeats();
    } else if (m.error === 'seat') {
      toSeats();
    } else if ($('pad').hidden) {
      // Silent re-join with the saved PIN failed (wrong / expired / locked): manual entry
      if (failSeat >= 0) { padOpen(failSeat, failName); padMsg(txt); } else toSeats();
    } else {
      padMsg(txt, true);   // Wrong PIN / locked: stay in the pad, start over
    }
  } else {
    $('live-msg').textContent = txt;
    setTimeout(() => { $('live-msg').textContent = ''; }, 2500);
  }
}

function onState(m) {
  if (m.lang) setLang(m.lang);
  const wasSeat = joined && you >= 0;
  g = m;
  you = m.joined ? m.you : -1;
  if (!m.active) {
    joined = false;
    show('lobby');
    return;
  }
  if (!m.joined) {
    // New game / game restarted: the device dropped our binding. Re-join as spectator.
    if (wasSeat) $('seat-msg').textContent = t('expired');
    joined = false;
    if (mode === 'seat' && !pending) mode = 'ask';
    watchJoin();
    return;
  }
  joined = true;
  const wp = m.web_players || [];
  if (you < 0 && mode !== 'watch' && !pending) {
    // Always show the seat list: the user must explicitly choose who they are.
    // Silent re-join with saved PIN happens when they click their name (seat click handler).
    renderSeats();
    show('seats');
    return;
  }
  show('live');
  render();
}

function renderSeats() {
  const wp = (g && g.web_players) || [];
  let s = stored();
  // Clean up stale saved session if the player is no longer in this game
  if (s && !wp.find(x => x.player === s.seat && x.name === s.name)) { forget(); s = null; }
  $('seat-list').innerHTML = wp.length ? wp.map(w => {
    const canRejoin = s && s.seat === w.player && s.name === w.name && s.pin;
    return `<button class="primary" data-seat="${w.player}" data-name="${esc(w.name)}" data-haspin="${w.has_pin ? 1 : 0}">` +
      `<span>&#128246; ${esc(w.name)}</span>` +
      `<span class="tag">${w.connected ? '&#10003; ' + t('connected_tag') : canRejoin ? '&#8594; ' + t('rejoin_tag') : !w.has_pin ? t('nopin_tag') : ''}</span>` +
      `</button>`;
  }).join('') : `<p class="muted">${t('no_web')}</p>`;
}

// --- PIN pad -------------------------------------------------------------------------------
function padOpen(seat, name, create = false) {
  padSeat = seat; padName = name; pin = '';
  createMode = create; createPin1 = '';
  $('pad-title').textContent = create ? t('create_pin', name) : t('pin_for', name);
  padMsg('');
  padDraw();
  $('pad').hidden = false;
}
function padClose() { $('pad').hidden = true; pin = ''; padSeat = null; createMode = false; createPin1 = ''; }
function padMsg(txt, clear) { $('pad-msg').textContent = txt; if (clear) { pin = ''; padDraw(); } }
function padDraw() {
  [...$('pin-cells').children].forEach((c, i) => { c.textContent = i < pin.length ? '•' : ''; c.className = i === pin.length ? 'cur' : ''; });
  $('pad-ok').disabled = pin.length !== 4;
}
function padKey(k) {
  if (k === 'del') pin = pin.slice(0, -1);
  else if (/^\d$/.test(k) && pin.length < 4) pin += k;
  $('pad-msg').textContent = '';
  padDraw();
  if (pin.length === 4 && k !== 'del') padOk();   // Submit on the 4th digit
}
function padOk() {
  if (pin.length !== 4 || padSeat === null) return;
  if (createMode) {
    if (!createPin1) {
      createPin1 = pin; pin = ''; padDraw();
      $('pad-title').textContent = t('confirm_pin');
      $('pad-msg').textContent = '';
    } else if (pin === createPin1) {
      if (!pending) {
        const p = createPin1;
        pending = {seat: padSeat, name: padName, pin: p};
        mode = 'seat';
        if (!send({cmd: 'setpin', player: padSeat, pin: p})) {
          padMsg(t('err_wait')); pending = null; mode = 'ask';
        }
      }
    } else {
      createPin1 = ''; pin = ''; padDraw();
      $('pad-title').textContent = t('create_pin', padName);
      padMsg(t('pin_no_match'));
    }
  } else if (!pending) {
    seatJoin(padSeat, padName, pin);
  }
}
$('keys').addEventListener('click', e => { const b = e.target.closest('button'); if (b) padKey(b.dataset.k || b.textContent); });
$('pad-ok').onclick = padOk;
$('pad-cancel').onclick = padClose;
document.addEventListener('keydown', e => {
  if ($('pad').hidden) return;
  if (/^\d$/.test(e.key)) padKey(e.key);
  else if (e.key === 'Backspace') padKey('del');
  else if (e.key === 'Enter') padOk();
  else if (e.key === 'Escape') padClose();
});

// --- Rendering -----------------------------------------------------------------------------
// ── 3D Dice engine ────────────────────────────────────────────────────────
const PIPS3D = {
  1: [[50,50]],
  2: [[28,28],[72,72]],
  3: [[28,28],[50,50],[72,72]],
  4: [[28,28],[72,28],[28,72],[72,72]],
  5: [[28,28],[72,28],[50,50],[28,72],[72,72]],
  6: [[28,26],[72,26],[28,50],[72,50],[28,74],[72,74]]
};
// Face name → value shown on that face (opposite faces sum to 7)
const FACE_VAL = {front:1, back:6, right:2, left:5, top:3, bottom:4};
// Value → [rotX, rotY] to bring that face to face the viewer
const FACE_ROT = {1:[0,0], 2:[0,-90], 3:[-90,0], 4:[90,0], 5:[0,90], 6:[0,180]};

let _dieRx = [], _dieRy = [];
let _dieVal = [];               // Last value each die was turned to (0 = unrolled / spinning)
let _dieRot = [], _dieDy = [];  // Scatter on the felt: 2D tilt (deg) and vertical offset (px)
let _rollAnim = null;
let _dieSz = 3.5, _dieHalf = 1.75;  // rem; overridden per page

const FACE_NAMES = ['front','back','right','left','top','bottom'];
function _faceTransform(name) {
  const h = _dieHalf;
  return {
    front:  `translateZ(${h}rem)`,
    back:   `rotateY(180deg) translateZ(${h}rem)`,
    right:  `rotateY(90deg) translateZ(${h}rem)`,
    left:   `rotateY(-90deg) translateZ(${h}rem)`,
    top:    `rotateX(90deg) translateZ(${h}rem)`,
    bottom: `rotateX(-90deg) translateZ(${h}rem)`,
  }[name];
}

function buildDice3D(container, n) {
  // Only rebuild if count changed
  if (container.children.length === n) return;
  container.innerHTML = '';
  _dieRx = Array(n).fill(0);
  _dieRy = Array(n).fill(0);
  _dieVal = Array(n).fill(0);
  _dieRot = Array(n).fill(0);
  _dieDy = Array(n).fill(0);
  const sz = _dieSz;
  for (let i = 0; i < n; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'die-wrap';
    wrap.dataset.i = String(i);
    const d3 = document.createElement('div');
    d3.className = 'die-3d';
    d3.style.width = sz + 'rem';
    d3.style.height = sz + 'rem';
    FACE_NAMES.forEach(name => {
      const f = document.createElement('div');
      f.className = 'face ' + name;
      f.style.transform = _faceTransform(name);
      const val = FACE_VAL[name];
      const pip_sz = Math.round(sz * 18 / 3.5 * 10) / 10;  // scale pips with die size
      f.innerHTML = (PIPS3D[val] || []).map(([x,y]) =>
        `<span style="left:${x}%;top:${y}%;width:${pip_sz}%;height:${pip_sz}%"></span>`).join('');
      d3.appendChild(f);
    });
    wrap.appendChild(d3);
    container.appendChild(wrap);
  }
}

function _d3(container, i) {
  const w = container.children[i];
  return w ? w.querySelector('.die-3d') : null;
}

const THROW_STYLES = {
  gentle:   { maxRot: 8,  spinFactor: 0.7 },
  normal:   { maxRot: 18, spinFactor: 1.0 },
  vigorous: { maxRot: 35, spinFactor: 1.5 }
};
let _throwStyle = 'normal';

// Tilt/offset a die on the felt. `reroll` picks a new random scatter (only when it lands with a
// new value); otherwise the stored scatter is reused so hold/release and re-renders never jitter.
function applyScatter(container, i, isHeld, reroll = false) {
  const wrap = container.children[i];
  if (!wrap) return;
  if (reroll) {
    const maxRot = (THROW_STYLES[_throwStyle] || THROW_STYLES.normal).maxRot;
    _dieRot[i] = (Math.random() * 2 - 1) * maxRot;
    _dieDy[i] = Math.random() * 14 - 7;
  }
  wrap.style.transform = isHeld
    ? `translateY(.38rem) rotate(${(_dieRot[i] * 0.15).toFixed(1)}deg)`
    : `translateY(${_dieDy[i].toFixed(1)}px) rotate(${_dieRot[i].toFixed(1)}deg)`;
}

function setDieValue(container, i, val, held) {
  const wrap = container.children[i];
  if (!wrap) return;
  // Skip rotation animation if value unchanged (prevents spin-on-hold bug)
  const prevVal = _dieVal[i] || 0;
  _dieVal[i] = val || 0;
  const valueChanged = val !== prevVal;
  const d3 = wrap.querySelector('.die-3d');
  wrap.classList.toggle('held-wrap', !!held);
  wrap.classList.toggle('unrolled', !val);
  d3.classList.toggle('held-3d', !!held);
  if (val && valueChanged) {
    d3.classList.add('landing');
    const [bx, by] = FACE_ROT[val] || [0, 0];
    // Always approach the target face along the shortest path (max 180° per axis)
    const cRx = _dieRx[i] % 360;
    const cRy = _dieRy[i] % 360;
    const dRx = ((bx - cRx) + 540) % 360 - 180;
    const dRy = ((by - cRy) + 540) % 360 - 180;
    _dieRx[i] = _dieRx[i] + dRx;
    _dieRy[i] = _dieRy[i] + dRy;
    d3.style.transform = `rotateX(${_dieRx[i]}deg) rotateY(${_dieRy[i]}deg)`;
  }
  applyScatter(container, i, held, !!val && valueChanged);
}

function startRollingAnim(container, rollingIdx, spinFactor = 1.0) {
  if (_rollAnim) return;
  rollingIdx.forEach(i => {
    const d3 = _d3(container, i);
    if (d3) d3.classList.remove('landing');   // Snappy spinning
    // Reset scatter during roll
    const wrap = container.children[i];
    if (wrap) wrap.style.transform = `rotate(0deg)`;
    // Forget the old value: the die must land (and re-scatter) even if it shows the same face again
    _dieVal[i] = 0;
  });
  const baseSpeed = 95 / spinFactor;
  _rollAnim = setInterval(() => {
    rollingIdx.forEach(i => {
      _dieRx[i] += (80 + Math.random() * 200) * spinFactor;
      _dieRy[i] += (80 + Math.random() * 200) * spinFactor;
      const d3 = _d3(container, i);
      if (d3) d3.style.transform = `rotateX(${_dieRx[i]}deg) rotateY(${_dieRy[i]}deg)`;
    });
  }, Math.round(baseSpeed));
}

function stopRollingAnim() {
  if (_rollAnim) { clearInterval(_rollAnim); _rollAnim = null; }
}
// ── End 3D Dice engine ────────────────────────────────────────────────────
_dieSz = 3.5; _dieHalf = 1.75;

function render() {
  if (!g || !g.active) return;
  const P = g.players, cur = P[g.current] || {name: '?'};
  const mine = you >= 0 && you === g.current && !g.finished;
  $('info').textContent = g.name + ' · ' + t('round', g.round, g.rounds) + ' · ' +
    (you >= 0 ? t('playing_as', P[you].name) : t('spectator'));
  $('turn').innerHTML = g.finished ? t('over') : t('turn') + ': <b>' + esc(cur.name) + '</b>' + (mine ? ' <span class="mine">– ' + t('you') + '</span>' : '');
  const canHold = mine && g.has_rolled && !g.rolling && !g.choosing;
  $('dice').className = 'dice' + (canHold ? ' act' : '');
  if (g.finished) {
    stopRollingAnim(); $('dice').innerHTML = ''; _dieRx = []; _dieRy = []; _dieVal = []; _dieRot = []; _dieDy = [];
  } else {
    buildDice3D($('dice'), g.dice.length);
    const rolling = g.rolling || g.shaking;
    if (rolling) {
      const rollingIdx = g.dice.map((_, i) => !g.held[i] ? i : -1).filter(i => i >= 0);
      startRollingAnim($('dice'), rollingIdx, (THROW_STYLES[_throwStyle] || THROW_STYLES.normal).spinFactor);
    } else {
      stopRollingAnim();
      g.dice.forEach((v, i) => setDieValue($('dice'), i, v, g.held[i]));
    }
    // Held dice live in their own tray below the felt: hide them on the felt, show clones in the tray
    const tray = $('held-tray');
    tray.innerHTML = '';
    g.dice.forEach((v, i) => {
      const src = $('dice').children[i];
      if (!src) return;
      const held = !!g.held[i] && !rolling;
      src.style.display = held ? 'none' : '';
      if (!held) return;
      const clone = src.cloneNode(true);
      clone.style.display = '';
      clone.style.transform = `rotate(${(_dieRot[i] * 0.15).toFixed(1)}deg)`;   // Tidy row, slight tilt
      clone.querySelector('.die-3d').classList.remove('landing');                // Already at rest
      clone.dataset.i = String(i);
      tray.appendChild(clone);
    });
    tray.classList.toggle('act', canHold);
  }
  $('hint').textContent = g.finished ? '' : (g.rolling || g.shaking) ? t('rolling')
    : canHold ? t('tap_hold')
    : mine && g.has_rolled && !g.choosing ? t('pick_score')
    : !mine ? t('wait', cur.name) : '';

  $('device-row').hidden = !(you >= 0 && !g.finished);
  if (you >= 0) { $('device').textContent = t('device'); $('device').disabled = false; }

  // Leather cup = primary roll control on my turn. It stays visible while the dice roll so the
  // pour animation is not cut off; it only fades out when no rolls are left.
  const showCup = mine;
  $('cup-wrap').hidden = !showCup;
  if (showCup) {
    $('cup-info').textContent = g.rolls_left === 1 ? t('cup_one') : t('cup_left', g.rolls_left);
    $('cup').classList.toggle('disabled-cup', !g.can_roll && !g.rolling);
    document.querySelectorAll('.cup-zone').forEach(z => { z.title = t('cup_' + ({top: 'gentle', mid: 'normal', bot: 'vigorous'}[z.dataset.zone])); });
  }
  const rb = $('roll');
  rb.hidden = !mine || showCup;   // Fallback button (kept in the DOM, hidden while the cup is shown)
  rb.disabled = !(mine && g.can_roll && !g.rolling);
  rb.textContent = g.can_roll ? t('roll', g.rolls_left) : t('roll_none');

  if (!mine || !g.has_rolled) sel = null;   // Clear the pick when it is no longer my turn / not rolled
  if (sel !== null && !g.categories.some(c => c.id === sel && c.potential !== undefined)) sel = null;

  // Score sheet: every player, every box; my column is clickable on my turn (gold = points, red = strike)
  const cc = i => (!g.finished && i === g.current) ? ' class="cur"' : '';
  // Add the current-column marker without producing a second class attribute
  const withCur = (td, i) => !cc(i) ? td : td.includes('class="') ? td.replace('class="', 'class="cur ') : td.replace('<td', '<td' + cc(i));
  function myCell(c, k) {
    const me = P[you];
    const scored = me.scores[k];
    if (scored !== null) return '<td>' + scored + '</td>';          // Already filled
    if (c.potential === undefined) return '<td class="muted">·</td>'; // Not selectable now
    const cls = 'pot' + (c.potential > 0 ? '' : '-zero') + (sel === c.id ? ' sel' : '');
    return `<td class="${cls}" data-cat="${c.id}">${c.potential}</td>`;
  }
  const cell = v => v === null ? '<td class="muted">·</td>' : '<td>' + v + '</td>';
  let h = '<thead><tr><th></th>' + P.map((p, i) => '<th' + cc(i) + '>' + esc(p.name) + (p.web ? ' &#128246;' : '') + '</th>').join('') + '</tr></thead><tbody>';
  let upperDone = false;
  g.categories.forEach((c, k) => {
    if (!c.upper && !upperDone) {
      upperDone = true;
      h += '<tr class="sum"><td>' + t('sum') + '</td>' + P.map((p, i) => '<td' + cc(i) + '>' + p.upper + '</td>').join('') + '</tr>';
      h += '<tr><td>Bonus</td>' + P.map((p, i) => '<td' + cc(i) + '>' + p.bonus + '</td>').join('') + '</tr>';
    }
    h += '<tr><td>' + esc(c.name) + '</td>' + P.map((p, i) => {
      const td = (i === you && mine && g.has_rolled && !g.rolling) ? myCell(c, k) : cell(p.scores[k]);
      return withCur(td, i);
    }).join('') + '</tr>';
  });
  h += '<tr class="sum"><td>' + t('total') + '</td>' + P.map((p, i) => '<td' + cc(i) + '>' + p.total + '</td>').join('') + '</tr></tbody>';
  $('score').innerHTML = h;
  if (g.finished && g.ranking) {
    const first = g.ranking.filter(r => r.place === 1).map(r => P[r.player].name).join(' & ');
    $('hint').textContent = t('winner', first);
  }
}

// --- Input ---------------------------------------------------------------------------------
$('seat-list').addEventListener('click', e => {
  const b = e.target.closest('button[data-seat]');
  if (!b) return;
  $('seat-msg').textContent = '';
  const seat = parseInt(b.dataset.seat, 10);
  const name = b.dataset.name;
  const s = stored();
  if (s && s.seat === seat && s.name === name && s.pin) {
    // Saved PIN for this exact seat+name: silent re-join (user explicitly clicked their name)
    $('seat-msg').textContent = t('joining');
    seatJoin(seat, name, s.pin);
  } else {
    padOpen(seat, name, b.dataset.haspin !== '1');   // No PIN yet: create one in the browser
  }
});
$('watch').onclick = () => { mode = 'watch'; forget(); if (g && g.active) { show('live'); render(); } };
function onDieClick(e) {
  const d = e.target.closest('.die-wrap');
  if (d && $('dice').classList.contains('act')) send({cmd: 'hold', die: parseInt(d.dataset.i, 10)});
}
$('dice').addEventListener('click', onDieClick);
$('held-tray').addEventListener('click', onDieClick);   // Tap a held die to release it
document.querySelectorAll('.cup-zone').forEach(zone => {
  zone.addEventListener('click', e => {
    e.stopPropagation();
    if (!isMine() || !g.can_roll || g.rolling) return;
    const zoneMap = {top: 'gentle', mid: 'normal', bot: 'vigorous'};
    _throwStyle = zoneMap[zone.dataset.zone] || 'normal';
    const styleClass = 'pour-' + _throwStyle;
    const cup = $('cup');
    cup.classList.remove('pour-gentle', 'pour-normal', 'pour-vigorous');
    void cup.offsetWidth;  // Reflow: restart the animation
    cup.classList.add(styleClass);
    // Clean up after the pour; also on cancel (cup hidden mid-pour) so it never replays when shown again
    const done = () => { cup.classList.remove(styleClass); cup.removeEventListener('animationcancel', done); cup.removeEventListener('animationend', done); };
    cup.addEventListener('animationend', done);
    cup.addEventListener('animationcancel', done);
    sel = null;
    send({cmd: 'roll'});
  });
});
$('roll').onclick = () => { sel = null; send({cmd: 'roll'}); };
$('score').addEventListener('click', e => {
  const td = e.target.closest('td[data-cat]');
  if (!td) return;
  const id = parseInt(td.dataset.cat, 10);
  if (sel === id) { send({cmd: 'choose', cat: id}); sel = null; render(); }   // Second tap writes
  else { sel = id; render(); }
});
$('leave').onclick = () => {
  forget();
  mode = 'ask'; pending = null; you = -1;
  $('seat-msg').textContent = '';
  if (ws) ws.close();   // Reconnects as a fresh, unbound client
  if (g && g.active) { renderSeats(); show('seats'); }
};
$('device').onclick = () => {
  if (send({cmd: 'leave'})) { $('device').textContent = t('leaving'); $('device').disabled = true; }
};

show('none');   // Nothing until the first state / error
connect();
</script>
