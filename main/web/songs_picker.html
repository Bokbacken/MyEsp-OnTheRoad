<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>OnTheRoad – Välj låt</title>
<link rel="stylesheet" href="/style.css">
<script src="/device-name.js"></script>
<style>
.top { display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; }
.langs button { padding: .3rem .6rem; font-size: .9rem; }
.langs button.on { background: var(--otr-orange); color: var(--otr-navy); }
.bar2 { display: flex; gap: .5rem; align-items: center; margin: .6rem 0; }
.bar2 input { flex: 1; min-width: 0; }
.bar2 button { white-space: nowrap; }
#crumbs { display: flex; flex-wrap: wrap; gap: .25rem; align-items: center; margin: .4rem 0; font-size: .95rem; }
#crumbs a { cursor: pointer; }
#crumbs span.sep { color: var(--otr-muted); }
#status { color: var(--otr-muted); min-height: 1.3em; font-size: .9rem; }
#now { color: var(--otr-teal); font-weight: 600; min-height: 1.3em; word-break: break-word; }
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li { display: flex; align-items: center; gap: .7rem; padding: .7rem .6rem; border-bottom: 1px solid var(--otr-line);
  cursor: pointer; border-radius: .5rem; }
ul.list li:hover, ul.list li:focus { background: var(--otr-panel); outline: none; }
ul.list li .ic { font-size: 1.3rem; width: 1.6rem; text-align: center; flex: none; }
ul.list li .tx { flex: 1; min-width: 0; }
ul.list li .t1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ul.list li .t2 { color: var(--otr-muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ul.list li .n { color: var(--otr-muted); font-size: .85rem; flex: none; }
ul.list li.cur .t1 { color: var(--otr-orange); }
ul.list li.busy { opacity: .5; pointer-events: none; }
#more { width: 100%; margin-top: .6rem; display: none; }
.hint { color: var(--otr-muted); font-size: .85rem; }
.actions { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; margin: .6rem 0; }
.actions select { flex: 1; min-width: 8rem; }
#draft[hidden] { display: none; }
li button { padding: .3rem .5rem; font-size: .85rem; }
dialog { max-width: min(90vw, 36rem); border: 1px solid var(--otr-line); border-radius: .7rem;
  background: var(--otr-panel); color: inherit; }
dialog::backdrop { background: #0009; }
#notice { color: var(--otr-orange); min-height: 1.3em; position: sticky; top: 0;
  background: var(--otr-panel); z-index: 1; }
</style>
</head>
<body>
<nav><a href="/">&#8592; OnTheRoad</a> &nbsp; <a href="/karaoke.html">&#127908; <span data-t="karaoke"></span></a></nav>
<div class="top">
  <h1>&#128203; <span data-t="title"></span></h1>
  <div class="langs"><button id="l-sv" onclick="setLang('sv', true)">SV</button> <button id="l-en" onclick="setLang('en', true)">EN</button></div>
</div>
<div id="now"></div>
<div id="notice" role="status" aria-live="polite"></div>
<div id="draft" class="actions" hidden>
  <span data-t="unsaved"></span>
  <button onclick="resolveDraft('save')" data-t="save"></button>
  <button class="secondary" onclick="resolveDraft('discard')" data-t="discard"></button>
</div>
<div class="bar2">
  <input type="search" id="q" autocomplete="off" enterkeyhint="search">
  <button id="rescan" class="secondary" onclick="rescan()" data-t="rescan"></button>
</div>
<div id="crumbs"></div>
<div id="status"></div>
<ul class="list" id="list"></ul>
<button id="more" onclick="load(true)" data-t="more"></button>
<p class="hint" data-t="hint"></p>
<section>
  <h2 data-t="playlists"></h2>
  <div class="actions">
    <select id="playlist" aria-label="Spellista" onchange="loadPlaylist()"></select>
    <button onclick="editList('create')" data-t="create"></button>
    <button id="rename-list" class="secondary" onclick="editList('rename')" data-t="rename"></button>
    <button id="delete-list" class="secondary" onclick="editList('delete')" data-t="delete"></button>
  </div>
  <p class="hint" data-t="playlistHint"></p>
  <ul class="list" id="playlist-songs"></ul>
</section>
<dialog id="song-dialog">
  <h2 id="song-title"></h2>
  <p class="hint" data-t="fontHint"></p>
  <label for="song-font">SoundFont (.sf2)</label>
  <select id="song-font"></select>
  <div class="actions">
    <button id="save-font" data-t="save"></button>
    <button class="secondary" onclick="$('song-dialog').close()" data-t="cancel"></button>
  </div>
</dialog>
<dialog id="draft-dialog">
  <p data-t="unsaved"></p>
  <div class="actions">
    <button data-choice="save" data-t="save"></button>
    <button data-choice="discard" class="secondary" data-t="discard"></button>
    <button data-choice="" class="secondary" data-t="cancel"></button>
  </div>
</dialog>

<script>
// v0.13.7 song picker: folders from GET /api/karaoke/songs?dir=, search with ?q= (artist + title, all
// folders), a tap opens and starts the song on the device (POST /api/karaoke/open). No PIN.
const T = {
  sv: { title: 'Välj låt', karaoke: 'Webbkaraoke', rescan: 'Skanna om', more: 'Visa fler', all: 'Alla låtar',
        search: 'Sök artist eller titel', songs: '{0} låtar', none: 'Inga låtar här',
        nomatch: 'Inga träffar för "{0}"', matches: '{0} träffar för "{1}"', scanning: 'Söker låtar på SD-kortet ...',
        opening: 'Öppnar {0} ...', playing: 'Spelas: {0}', open: 'Öppen: {0}', failed: 'Kunde inte öppna: {0}',
        neterr: 'Ingen kontakt med enheten', limit: 'Max {0} låtar visas', shown: 'visar {0} av {1}',
        hint: 'Låten startar på enheten. Lyssna i telefonen via Webbkaraoke. Mappar organiserar du själv på SD-kortet (/otr/karaoke).',
        playlists: 'Spellistor', create: 'Skapa', rename: 'Byt namn', delete: 'Radera', remove: 'Ta bort',
        add: '+ Lista', settings: 'SF2', save: 'Spara', discard: 'Kasta ändringar', cancel: 'Avbryt',
        noLists: 'Skapa en spellista', listName: 'Spellistans namn (max 48 UTF-8-byte)',
        deleteList: 'Radera spellistan "{0}"? Låtfilerna behålls.',
        playlistHint: 'Välj lista och använd + Lista vid en låt. Tryck på en låt i listan för att spela den. Pilarna ändrar ordningen; låtarna startas en i taget.',
        fontHint: 'Välj ljudbank för denna låt och bekräfta med Spara. Övriga sparade låtinställningar behålls.',
        automatic: 'Använd standardljudbank', unsaved: 'Den öppna låten har osparade inställningar. Spara eller kasta dem?',
        saved: 'Sparat', added: 'Låten finns nu i spellistan', missingPath: 'Saknar sökväg – lägg till låten igen',
        up: 'Flytta upp', down: 'Flytta ned', busy: 'Vänta tills ändringen är klar' },
  en: { title: 'Choose song', karaoke: 'Web karaoke', rescan: 'Rescan', more: 'Show more', all: 'All songs',
        search: 'Search artist or title', songs: '{0} songs', none: 'No songs here',
        nomatch: 'No matches for "{0}"', matches: '{0} matches for "{1}"', scanning: 'Scanning the SD card for songs ...',
        opening: 'Opening {0} ...', playing: 'Playing: {0}', open: 'Open: {0}', failed: 'Could not open: {0}',
        neterr: 'No contact with the device', limit: 'Max {0} songs shown', shown: 'showing {0} of {1}',
        hint: 'The song starts on the device. Listen on your phone via Web karaoke. You organise the folders yourself on the SD card (/otr/karaoke).',
        playlists: 'Playlists', create: 'Create', rename: 'Rename', delete: 'Delete', remove: 'Remove',
        add: '+ List', settings: 'SF2', save: 'Save', discard: 'Discard changes', cancel: 'Cancel',
        noLists: 'Create a playlist', listName: 'Playlist name (max 48 UTF-8 bytes)',
        deleteList: 'Delete playlist "{0}"? Song files are kept.',
        playlistHint: 'Choose a list and use + List beside a song. Tap a song in the list to play it. Arrows change the order; songs are started individually.',
        fontHint: 'Choose a bank for this song and confirm with Save. Other saved song settings are kept.',
        automatic: 'Use default sound bank', unsaved: 'The open song has unsaved settings. Save or discard them?',
        saved: 'Saved', added: 'The song is now in the playlist', missingPath: 'No path – add this song again',
        up: 'Move up', down: 'Move down', busy: 'Wait for the change to finish' }
};
let L = 'sv';
const t = (k, ...a) => ((T[L] || T.sv)[k] || T.sv[k] || k).replace(/\{(\d)\}/g, (m, i) => a[i]);
const $ = id => document.getElementById(id);
let dir = '', query = '', last = null, songs = [], busy = false, pollTimer = 0, seq = 0;
let playlists = [], listSeq = 0, listsBusy = false, fontPath = '';

function setLang(l, save) {
  if (!T[l]) return;
  L = l;
  document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
  $('q').placeholder = t('search');
  $('l-sv').classList.toggle('on', l === 'sv');
  $('l-en').classList.toggle('on', l === 'en');
  $('playlist').setAttribute('aria-label', t('playlists'));
  if (save) try { localStorage.setItem('otr_lang', l); } catch (e) {}
  if (last) render();
  renderPlaylistOptions();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function go(d) { dir = d; query = ''; $('q').value = ''; load(false); }

async function load(more) {
  const my = ++seq;
  const off = more ? songs.length : 0;
  const p = new URLSearchParams({ offset: off, limit: 200 });
  if (query) p.set('q', query); else p.set('dir', dir);
  try {
    const r = await fetch('/api/karaoke/songs?' + p, { cache: 'no-store' });
    const j = await r.json();
    if (my !== seq) return;           // A newer request is on its way
    if (!j.ok) throw new Error(j.error || r.status);
    if (!more) songs = [];
    songs = songs.concat(j.songs || []);
    last = j;
    render();
    clearTimeout(pollTimer);
    if (j.scanning) pollTimer = setTimeout(() => load(false), 1500);   // Fill in when the scan ends
  } catch (e) {
    if (my === seq) $('status').textContent = t('neterr');
  }
}

function crumbs() {
  const c = $('crumbs');
  c.textContent = '';
  const add = (label, d) => {
    const a = el('a', '', label);
    a.href = '#';
    a.onclick = ev => { ev.preventDefault(); go(d); };
    c.appendChild(a);
  };
  add('\u{1F3E0} ' + t('all'), '');
  if (query) return;
  let acc = '';
  dir.split('/').filter(Boolean).forEach(part => {
    acc = acc ? acc + '/' + part : part;
    c.appendChild(el('span', 'sep', '›'));
    add(part, acc);
  });
}

function nameOf(s) { return (s.artist ? s.artist + ' – ' : '') + s.title; }

function render() {
  const j = last;
  crumbs();
  const list = $('list');
  list.textContent = '';
  if (!query && dir) {
    const li = el('li');
    li.tabIndex = 0;
    li.appendChild(el('span', 'ic', '\u2B05'));
    li.appendChild(el('span', 'tx', '..'));
    const up = dir.includes('/') ? dir.slice(0, dir.lastIndexOf('/')) : '';
    li.onclick = () => go(up);
    list.appendChild(li);
  }
  (j.dirs || []).forEach(d => {
    const li = el('li');
    li.tabIndex = 0;
    li.appendChild(el('span', 'ic', '\u{1F4C1}'));
    const tx = el('span', 'tx');
    tx.appendChild(el('div', 't1', d.name));
    li.appendChild(tx);
    li.appendChild(el('span', 'n', t('songs', d.count)));
    li.onclick = () => go(d.path);
    li.onkeydown = e => { if (e.key === 'Enter') go(d.path); };
    list.appendChild(li);
  });
  songs.forEach(s => {
    const li = el('li', s.path === j.current ? 'cur' : '');
    li.tabIndex = 0;
    li.appendChild(el('span', 'ic', s.path === j.current && j.playing ? '\u25B6' : '\u266A'));
    const tx = el('span', 'tx');
    tx.appendChild(el('div', 't1', s.title));
    const sub = [s.artist, query && s.dir ? '\u{1F4C1} ' + s.dir : ''].filter(Boolean).join('  ·  ');
    if (sub) tx.appendChild(el('div', 't2', sub));
    li.appendChild(tx);
    li.onclick = () => openSong(s, li);
    li.onkeydown = e => { if (e.key === 'Enter') openSong(s, li); };
    const add = actionButton(t('add'), async () => {
      const id = Number($('playlist').value);
      if (!id) { $('notice').textContent = t('noLists'); return; }
      await mutateList({ action: 'add', id, path: s.path });
      $('notice').textContent = t('added');
    });
    add.disabled = !playlists.length;
    li.appendChild(add);
    li.appendChild(actionButton(t('settings'), () => editSong(s)));
    list.appendChild(li);
  });
  let st;
  if (j.scanning) st = t('scanning');
  else if (j.error) st = j.error;
  else if (query) st = j.count ? t('matches', j.count, query) : t('nomatch', query);
  else st = j.count ? t('songs', j.count) : t('none');
  if (songs.length < j.count) st += ' (' + t('shown', songs.length, j.count) + ')';
  if (j.limitReached && !query && !dir) st += ' – ' + t('limit', 2000);
  $('status').textContent = st;
  $('more').style.display = songs.length < j.count ? 'block' : 'none';
  $('rescan').disabled = !!j.scanning;
  const cur = songs.find(s => s.path === j.current);
  $('now').textContent = j.current ? t(j.playing ? 'playing' : 'open', cur ? nameOf(cur) : j.current.split('/').pop()) : '';
  $('draft').hidden = !j.dirty;
}

async function request(url, data) {
  const r = await fetch(url, data === undefined ? { cache: 'no-store' } :
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const j = await r.json();
  if (!r.ok || !j.ok) {
    const error = new Error(j.error || String(r.status));
    error.code = j.code; error.current = j.current;
    throw error;
  }
  return j;
}

function actionButton(text, action) {
  const b = el('button', 'secondary', text);
  b.onclick = async e => {
    e.stopPropagation();
    if (b.disabled) return;
    b.disabled = true;
    try { await action(); } catch (error) { $('notice').textContent = error.message || t('neterr'); }
    finally { b.disabled = false; }
  };
  b.onkeydown = e => e.stopPropagation();
  return b;
}

function chooseDraft() {
  const d = $('draft-dialog');
  return new Promise(resolve => {
    let decision = '';
    d.querySelectorAll('[data-choice]').forEach(b => {
      b.onclick = () => { decision = b.dataset.choice; d.close(); };
    });
    d.onclose = () => resolve(decision);
    d.showModal();
  });
}

async function openSong(s, li) {
  if (busy) return;   // Double-tap guard
  busy = true;
  li.classList.add('busy');
  $('now').textContent = t('opening', nameOf(s));
  try {
    try {
      await request('/api/karaoke/open', { path: s.path });
    } catch (error) {
      if (error.code !== 'unsaved') throw error;
      const decision = await chooseDraft();
      if (!decision) { render(); return; }
      await request('/api/karaoke/open', { path: s.path, decision, current: error.current });
    }
    setTimeout(() => load(false), 800);
  } catch (e) {
    $('now').textContent = t('failed', e.message || t('neterr'));
  } finally {
    setTimeout(() => { busy = false; li.classList.remove('busy'); }, 1000);
  }
}

function currentPath() { return last && last.current ? '/sdcard/otr/karaoke/' + last.current : ''; }

async function resolveDraft(action) {
  if (busy) return;
  busy = true;
  try {
    await request('/api/karaoke/song', { action, current: currentPath() });
    $('notice').textContent = t('saved');
    await load(false);
  } catch (e) { $('notice').textContent = e.message || t('neterr'); }
  finally { busy = false; }
}

function renderPlaylistOptions() {
  const select = $('playlist'), selected = select.value;
  select.textContent = '';
  if (!playlists.length) {
    const option = el('option', '', t('noLists')); option.value = '';
    select.appendChild(option);
  }
  playlists.forEach(p => {
    const option = el('option', '', p.name + ' (' + p.count + ')'); option.value = String(p.id);
    select.appendChild(option);
  });
  if (playlists.some(p => String(p.id) === selected)) select.value = selected;
  $('rename-list').disabled = $('delete-list').disabled = !playlists.length;
}

async function loadPlaylists(selected) {
  const j = await request('/api/karaoke/playlists');
  playlists = j.playlists;
  renderPlaylistOptions();
  if (selected) $('playlist').value = String(selected);
  if (last) render();
  await loadPlaylist();
}

async function loadPlaylist() {
  const my = ++listSeq, id = Number($('playlist').value);
  const list = $('playlist-songs'); list.textContent = '';
  if (!id) return;
  try {
    let entries = [], count;
    do {
      const j = await request('/api/karaoke/playlists?id=' + id + '&offset=' + entries.length);
      if (my !== listSeq) return;
      const p = j.playlists[0]; count = p.count;
      entries = entries.concat(p.songs);
      if (!p.songs.length && entries.length < count) throw new Error(t('neterr'));
    } while (entries.length < count);
    entries.forEach((s, index) => {
      const li = el('li');
      const name = el('span', 'tx', s.path ? nameOf(s) : t('missingPath'));
      li.appendChild(name);
      if (s.path) {
        li.tabIndex = 0;
        li.onclick = () => openSong(s, li);
        li.onkeydown = e => { if (e.key === 'Enter') openSong(s, li); };
      }
      for (const [action, label, disabled] of [
        ['up', '↑', index === 0], ['down', '↓', index + 1 === entries.length], ['remove', t('remove'), false]
      ]) {
        const b = actionButton(label, () => mutateList({ action, id, crc: s.crc, size: s.size }));
        b.setAttribute('aria-label', t(action === 'remove' ? 'remove' : action));
        b.disabled = disabled; li.appendChild(b);
      }
      list.appendChild(li);
    });
  } catch (e) { if (my === listSeq) $('notice').textContent = e.message || t('neterr'); }
}

async function mutateList(data) {
  if (listsBusy) throw new Error(t('busy'));
  listsBusy = true;
  try {
    const j = await request('/api/karaoke/playlists', data);
    await loadPlaylists(data.action === 'delete' ? null : j.id);
  } finally { listsBusy = false; }
}

async function editList(action) {
  const id = Number($('playlist').value), p = playlists.find(p => p.id === id);
  let name = '';
  if (action === 'delete') {
    if (!p || !confirm(t('deleteList', p.name))) return;
  } else {
    name = prompt(t('listName'), action === 'rename' && p ? p.name : '');
    if (name === null) return;
    name = name.trim();
    if (!name) return;
  }
  try { await mutateList({ action, id, name }); }
  catch (e) { $('notice').textContent = e.message || t('neterr'); }
}

async function editSong(s) {
  const j = await request('/api/karaoke/song?path=' + encodeURIComponent(s.path));
  fontPath = s.path;
  $('song-title').textContent = nameOf(s);
  const select = $('song-font'); select.textContent = '';
  const fonts = ['', ...j.fonts];
  if (j.sf2 && !fonts.includes(j.sf2)) fonts.push(j.sf2);
  fonts.forEach(font => {
    const option = el('option', '', font || t('automatic')); option.value = font;
    select.appendChild(option);
  });
  select.value = j.sf2;
  $('song-dialog').showModal();
}

$('save-font').onclick = async () => {
  const button = $('save-font'); button.disabled = true;
  try {
    await request('/api/karaoke/song', { action: 'font', path: fontPath, sf2: $('song-font').value });
    $('song-dialog').close(); $('notice').textContent = t('saved');
    await load(false);
  } catch (e) {
    $('song-dialog').close();
    $('notice').textContent = e.message || t('neterr');
    if (e.code === 'unsaved') await load(false);
  } finally { button.disabled = false; }
};

async function rescan() {
  $('rescan').disabled = true;
  try { await request('/api/karaoke/rescan', {}); }
  catch (e) { $('notice').textContent = e.message || t('neterr'); }
  setTimeout(() => load(false), 500);
}

let qTimer = 0;
$('q').addEventListener('input', () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { query = $('q').value.trim(); load(false); }, 300);
});

let saved = null;
try { saved = localStorage.getItem('otr_lang'); } catch (e) {}
setLang(saved || ((navigator.language || 'sv').toLowerCase().startsWith('sv') ? 'sv' : 'en'), false);
load(false);
loadPlaylists().catch(e => { $('notice').textContent = e.message || t('neterr'); });
window.addEventListener('focus', () => load(false));
</script>
</body>
</html>
